services:
  lactarium:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lactarium
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      GOOGLE_SHEETS_ID: ${GOOGLE_SHEETS_ID:-}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY:-}
    volumes:
      - lactarium-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.lactarium.rule=Host(`${LACTARIUM_HOST}`)
      - traefik.http.routers.lactarium.entrypoints=web,websecure
      - traefik.http.routers.lactarium.tls=true
      - traefik.http.routers.lactarium.tls.certresolver=mytlschallenge
      - traefik.http.routers.lactarium.middlewares=lactarium@docker
      - traefik.http.middlewares.lactarium.headers.SSLRedirect=true
      - traefik.http.middlewares.lactarium.headers.STSSeconds=315360000
      - traefik.http.middlewares.lactarium.headers.browserXSSFilter=true
      - traefik.http.middlewares.lactarium.headers.contentTypeNosniff=true
      - traefik.http.middlewares.lactarium.headers.forceSTSHeader=true
      - traefik.http.middlewares.lactarium.headers.SSLHost=${LACTARIUM_HOST}
      - traefik.http.middlewares.lactarium.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.lactarium.headers.STSPreload=true
      - traefik.http.services.lactarium.loadbalancer.server.port=3000
    networks:
      - common_network

volumes:
  lactarium-data:

networks:
  common_network:
    external: true
